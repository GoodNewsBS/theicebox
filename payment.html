<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — The IceBox Frozen Treats</title>
  <link href="https://fonts.googleapis.com/css2?family=Ranchers&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="icebox.css">
  <link rel="stylesheet" href="icebox-grid.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Ranchers", system-ui;
      background: linear-gradient(to right, #0083B0, #00B4DB);
      min-height: 100vh;
      color: rgb(48, 194, 239);
    }

    /* ── Nav ── */
    .site-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(0,0,0,0.15);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .site-nav a { color: rgb(48,194,239); text-decoration: none; font-size: 1.1rem; }
    .site-nav .logo { font-size: 1.6rem; }

    /* ── Page ── */
    .page {
      max-width: 900px;
      margin-inline: auto;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      text-align: center;
      margin-bottom: 2rem;
      color: rgb(48, 194, 239);
    }

    h2 {
      font-size: 1.6rem;
      color: rgb(48, 194, 239);
      margin-bottom: 1rem;
    }

    /* ── Layout ── */
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 680px) {
      .checkout-layout { grid-template-columns: 1fr; }
    }

    /* ── Boxes ── */
    .checkout-box {
      background: rgba(255,255,255,0.12);
      border-radius: 1em;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Form inputs ── */
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.9rem; opacity: 0.85; }

    .form-input {
      width: 100%;
      padding: 0.6em 0.8em;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 0.5em;
      background: rgba(255,255,255,0.15);
      color: white;
      font-family: "Ranchers", system-ui;
      font-size: 1rem;
    }
    .form-input::placeholder { color: rgba(255,255,255,0.5); }
    .form-input:focus { outline: none; border-color: white; }

    textarea.form-input { resize: vertical; min-height: 80px; }

    /* ── Stripe Elements ── */
    #payment-element {
      background: white;
      padding: 1rem;
      border-radius: 0.6em;
      min-height: 60px;
    }

    #express-checkout-element {
      margin-bottom: 1rem;
    }

    /* ── Messages ── */
    #payment-message {
      color: #ffe0e0;
      font-size: 1rem;
      text-align: center;
      min-height: 1.5rem;
    }

    /* ── Pay button ── */
    #pay-btn {
      font-family: "Ranchers", system-ui;
      font-size: 1.2rem;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 0.6em;
      padding: 0.8em 2em;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }
    #pay-btn:hover   { opacity: 0.88; }
    #pay-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Order summary ── */
    .order-summary-item {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      font-size: 1rem;
      color: white;
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.3rem;
      padding-top: 0.8rem;
      color: white;
    }

    /* ── Empty cart ── */
    .empty-cart {
      text-align: center;
      padding: 4rem 2rem;
      font-size: 1.3rem;
      opacity: 0.8;
    }
    .empty-cart a { color: white; text-decoration: underline; }

    /* ── Loading ── */
    .loading-text {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      padding: 1rem;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="site-nav">
  <a href="index.html" class="logo">🧊 The IceBox</a>
  <a href="cart.html" style="color:white;">← Back to Cart</a>
</nav>

<div class="page">
  <h1>Checkout</h1>

  <!-- Empty cart state -->
  <div id="empty-state" class="empty-cart" style="display:none;">
    Your cart is empty.<br><br>
    <a href="cart.html">Add some treats →</a>
  </div>

  <!-- Checkout layout -->
  <div id="checkout-layout" class="checkout-layout" style="display:none;">

    <!-- LEFT: Customer info + payment -->
    <div style="display:flex; flex-direction:column; gap:1.5rem;">

      <!-- Customer info -->
      <div class="checkout-box">
        <h2>Your Info</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="customer-name" class="form-input"
            placeholder="Jane Smith" autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="customer-email" class="form-input"
            placeholder="jane@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Phone (optional)</label>
          <input type="tel" id="customer-phone" class="form-input"
            placeholder="(215) 555-0100" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>Flavor &amp; Size Notes
            <span style="font-size:0.8rem; opacity:0.7;">
              (e.g. "Water Ice Large — Cherry, Gelati Medium — Sour")
            </span>
          </label>
          <textarea id="order-notes" class="form-input"
            placeholder="List your flavor and size choices for each item..."></textarea>
        </div>
      </div>

      <!-- Payment -->
      <div class="checkout-box">
        <h2>Payment</h2>
        <p style="font-size:0.9rem; opacity:0.8; font-family:system-ui;">
          Accepts Apple Pay, Google Pay, debit &amp; credit cards.
          Secured by Stripe.
        </p>

        <!-- Apple Pay / Google Pay renders here automatically -->
        <div id="express-checkout-element"></div>

        <div id="payment-message"></div>

        <!-- Card fields -->
        <div id="payment-element">
          <div class="loading-text">Loading payment form...</div>
        </div>

        <button id="pay-btn" disabled>Loading...</button>
      </div>

    </div>

    <!-- RIGHT: Order summary -->
    <div class="checkout-box" style="align-self:start;">
      <h2>Order Summary</h2>
      <div id="order-items"></div>
      <div class="order-total">
        <span>Total</span>
        <strong id="order-total-display"></strong>
      </div>
      <a href="cart.html"
        style="display:block; text-align:center; margin-top:1rem;
               color:white; text-decoration:underline; font-size:0.95rem;">
        ← Edit cart
      </a>
    </div>

  </div>
</div>

<script>
  // ── Cart helpers ──────────────────────────────────────
  function getCart() {
    return JSON.parse(localStorage.getItem('icebox_cart') || '[]');
  }

  function formatPrice(cents) {
    return '$' + (cents / 100).toFixed(2);
  }

  function cartTotal(cart) {
    return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  }

  // ── Init page ─────────────────────────────────────────
  const cart  = getCart();
  const total = cartTotal(cart);

  if (cart.length === 0) {
    document.getElementById('empty-state').style.display    = 'block';
    document.getElementById('checkout-layout').style.display = 'none';
  } else {
    document.getElementById('empty-state').style.display    = 'none';
    document.getElementById('checkout-layout').style.display = 'grid';

    // Render order summary
    const itemsEl = document.getElementById('order-items');
    itemsEl.innerHTML = cart.map(item => `
      <div class="order-summary-item">
        <span>${item.name} × ${item.qty}</span>
        <span>${formatPrice(item.price * item.qty)}</span>
      </div>
    `).join('');

    document.getElementById('order-total-display').textContent = formatPrice(total);

    // Init Stripe
    initStripe();
  }

  // ── Stripe init ───────────────────────────────────────
  let stripe, elements;

  async function initStripe() {
    const btn = document.getElementById('pay-btn');
    const msg = document.getElementById('payment-message');

    try {
      const items    = cart.map(i => `${i.name} x${i.qty}`).join(', ');
      const email    = document.getElementById('customer-email').value || '';

      // Call Netlify function to create PaymentIntent
      const res = await fetch('/.netlify/functions/create-payment', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ amount: total, items, customerEmail: email }),
      });

      const data = await res.json();

      if (data.error) {
        msg.textContent = data.error;
        return;
      }

      // Init Stripe with publishable key from function response
      stripe   = Stripe(data.publishableKey);
      elements = stripe.elements({
        clientSecret: data.clientSecret,
        appearance: {
          theme: 'stripe',
          variables: {
            colorPrimary:  '#0083B0',
            fontFamily:    '"Ranchers", system-ui',
            borderRadius:  '8px',
          },
        },
      });

      // Mount Express Checkout (Apple Pay / Google Pay)
      const expressEl = elements.create('expressCheckout');
      expressEl.mount('#express-checkout-element');

      expressEl.on('confirm', async () => {
        await submitPayment();
      });

      // Mount Card / Debit card fields
      const paymentEl = elements.create('payment', {
        layout: { type: 'tabs' },
      });
      paymentEl.mount('#payment-element');

      // Enable pay button
      btn.textContent = `Pay ${formatPrice(total)}`;
      btn.disabled    = false;

    } catch (err) {
      document.getElementById('payment-message').textContent =
        'Failed to load payment form. Please refresh and try again.';
      console.error(err);
    }
  }

  // ── Submit payment ────────────────────────────────────
  document.getElementById('pay-btn').addEventListener('click', submitPayment);

  async function submitPayment() {
    const btn   = document.getElementById('pay-btn');
    const msg   = document.getElementById('payment-message');
    const name  = document.getElementById('customer-name').value.trim();
    const email = document.getElementById('customer-email').value.trim();

    // Validate
    if (!name || !email) {
      msg.textContent = 'Please fill in your name and email.';
      return;
    }

    btn.disabled    = true;
    btn.textContent = '⏳ Processing...';
    msg.textContent = '';

    const { error } = await stripe.confirmPayment({
      elements,
      confirmParams: {
        return_url: window.location.origin + '/success.html',
        payment_method_data: {
          billing_details: { name, email },
        },
      },
    });

    // If we reach here something went wrong
    // (successful payments redirect away automatically)
    if (error) {
      msg.textContent = error.message;
      btn.disabled    = false;
      btn.textContent = `Pay ${formatPrice(total)}`;
    }
  }
</script>

</body>
</html>
